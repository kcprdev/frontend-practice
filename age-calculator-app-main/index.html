<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Age Calculator App</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="card">
      <form class="form">
        <section class="inputs">
          <section class="input-section">
            <label for="day">DAY</label>
            <input type="number" id="day" class="input" placeholder="DD" />
            <small class="error-message"></small>
          </section>

          <section class="input-section">
            <label for="month">MONTH</label>
            <input type="number" id="month" class="input" placeholder="MM" />
            <small class="error-message"></small>
          </section>

          <section class="input-section">
            <label for="year">YEAR</label>
            <input type="number" id="year" class="input" placeholder="YYYY" />
            <small class="error-message"></small>
          </section>
        </section>

        <section class="divider">
          <button type="submit" class="btn">
            <img
              src="./assets/images/icon-arrow.svg"
              alt="Calculate Age"
              class="icon"
            />
          </button>
        </section>
      </form>

      <section class="output">
        <p class="answer"><span class="value">--</span> years</p>

        <p class="answer"><span class="value">--</span> months</p>

        <p class="answer"><span class="value">--</span> days</p>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge"> Frontend Mentor </a
      >. Coded by <a href="#">Karri Chaitanya Pratap Reddy</a>.
    </footer>

    <script src="script.js"></script>
  </body>
</html>
